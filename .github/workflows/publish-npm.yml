name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require NPM_TOKEN
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured"
            exit 1
          fi

      - name: Download npm installer artifact from the GitHub Release
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*-npm-package.tar.gz" \
            --dir artifacts

          PACKAGE="$(find artifacts -maxdepth 1 -name '*-npm-package.tar.gz' | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "No npm package artifact found in the release assets"
            exit 1
          fi

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Publish package to npm
        shell: bash
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish "$PACKAGE" --access public --tag next
          else
            npm publish "$PACKAGE" --access public
          fi

