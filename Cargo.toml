[package]
name = "mcp-advwiki"
version = "0.2.5"
edition = "2024"
description = "A local wiki with hybrid BM25 + optional semantic search, made for AIs and MCP clients. Good for microservice architecture documentation and knowledge bases."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dfalci/mcp-advwiki"
repository = "https://github.com/dfalci/mcp-advwiki"
authors = ["Daniel Falci <danielfalci@gmail.com>"]

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
md-5 = "0.10"
notify = "8.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "system-proxy", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
